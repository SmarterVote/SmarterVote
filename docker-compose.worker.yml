# Local pipeline worker — runs races tagged runner="local" end-to-end. It is a
# permanent first-class alternative to the default one-shot Cloud Run Job runner.
#
# Setup:
#   1. Create Application Default Credentials on the host. Recommended: impersonate
#      the pipeline Cloud Run Job's service account, so the local worker has
#      exactly the production job's access (its Firestore, bucket and secret
#      grants) instead of your personal Owner/Editor rights:
#        gcloud auth application-default login \
#          --impersonate-service-account=pipeline-job-dev@<PROJECT_ID>.iam.gserviceaccount.com
#      This needs roles/iam.serviceAccountTokenCreator on that account (Terraform
#      currently grants it only on the races-api account), and the heartbeat
#      behind the local_worker_stale alert additionally needs
#      roles/logging.logWriter on it. Plain `gcloud auth application-default
#      login` also works, using your own identity.
#      ADC is written to %APPDATA%\gcloud (Windows) or ~/.config/gcloud
#      (Linux/macOS). The mount below defaults to the Windows path; on
#      Linux/macOS set GCLOUD_CONFIG_DIR=$HOME/.config/gcloud.
#   2. Ensure ./.env has the LLM/search API keys the agent needs (OpenRouter, Serper)
#      and GCS_BUCKET_NAME / GOOGLE_CLOUD_PROJECT for the target (dev) environment.
#   3. Build from an up-to-date checkout of origin/main, stamping the commit
#      (WORKER_GIT_COMMIT is required; compose refuses to run without it):
#        bash/zsh:   WORKER_GIT_COMMIT=$(git rev-parse HEAD) GCLOUD_CONFIG_DIR=$HOME/.config/gcloud \
#                      docker compose -f docker-compose.worker.yml up -d --build
#        PowerShell: $env:WORKER_GIT_COMMIT = (git rev-parse HEAD); docker compose -f docker-compose.worker.yml up -d --build
#
# To route work here:  run_race(<race_id>, runner="local")  (via the MCP tool / admin API)
services:
  pipeline-worker:
    build:
      context: .
      dockerfile: pipeline_client/Dockerfile.worker
      args:
        # Stamps the image with the commit it was built from so the worker can
        # report whether it predates merged fixes. Set WORKER_GIT_COMMIT in the
        # environment to the output of `git rev-parse HEAD`; an unset value
        # used to build an image that reported "unknown" and silently kept
        # claiming work after fixes merged.
        WORKER_GIT_COMMIT: ${WORKER_GIT_COMMIT:?set WORKER_GIT_COMMIT to the output of git rev-parse HEAD}
    env_file:
      - .env
    environment:
      PIPELINE_MODE: gcp
      # Agent drafts already use GCS directly. The generic run-artifact backend
      # must also be explicit or Settings defaults it to ephemeral container
      # storage even though this worker has a cloud bucket configured.
      STORAGE_MODE: gcp
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud-config/application_default_credentials.json
      # Overridable via WORKER_CONCURRENCY in .env. Measured 2026-08-24: four
      # concurrent races used 165 MiB of a 15.3 GiB allocation at 0.4% CPU
      # across 22 cores, so local resources are not the binding constraint —
      # the workload is I/O-bound on web fetches and LLM calls. Provider rate
      # limits bind first; raise this before worrying about memory.
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      WORKER_POLL_SECONDS: "3"
      # Optional race|candidate|issue diagnostic used to follow one stance's
      # source array through phase boundaries without changing stored data.
      PIPELINE_ISSUE_SOURCE_TRACE: "${PIPELINE_ISSUE_SOURCE_TRACE:-}"
      # GCS_BUCKET / FIRESTORE_PROJECT come from .env; override here if needed.
    # Docker's embedded resolver intermittently failed to resolve
    # oauth2.googleapis.com (Errno -5), breaking Google auth for Firestore
    # while GCS writes continued on a cached token. Pin public resolvers.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${GCLOUD_CONFIG_DIR:-${APPDATA}/gcloud}:/gcloud-config:ro
    restart: unless-stopped
    # Active research commonly exceeds two hours. SIGTERM stops new leases and
    # lets in-flight races checkpoint/finish; do not force-kill them after 120s.
    stop_grace_period: 3h
