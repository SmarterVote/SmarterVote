[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartervote-schema"
# Keep in step with ``shared/__init__.py``'s ``__version__``. This is the value
# `pip install -e shared/` records as distribution metadata; there is no
# setup.py any more, so this and ``__init__`` are the only two places.
version = "0.4.0"
description = "Shared Pydantic models for SmarterVote project"
authors = [{name = "SmarterVote Team"}]
dependencies = [
    "pydantic>=2.0.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "isort",
]

[tool.setuptools]
packages = ["shared", "shared.data"]

[tool.setuptools.package-dir]
shared = "."
"shared.data" = "data"

# Black and isort take the nearest pyproject.toml as the project root, so any
# run given only files under shared/ (a single-file run, or a pre-commit hook
# passing staged files) stops here, not at the repo root. Without these it
# silently reformats to black's 88-column default. Keep in step with the root.
[tool.black]
line-length = 127
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 127
