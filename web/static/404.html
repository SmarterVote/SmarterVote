<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="This Smarter.Vote page could not be found. Browse published U.S. House, Senate, and governor election research instead."
    />
    <title>Page not found | Smarter.Vote</title>
    <script>
      // Mirror app.html: honor the saved darkMode choice, else the OS setting.
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem("darkMode");
          dark =
            saved !== null
              ? saved === "true"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (err) {}
        }
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --text: #172033;
        --surface: #ffffff;
        --border: #e5e7eb;
        --action-border: #d1d5db;
        --muted: #4b5563;
        --footer: #5f6673;
        --link: #1d4ed8;
        --brand: #2563eb;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      /* Dark: explicit saved choice, or OS preference when no class/JS. */
      :root.dark {
        color-scheme: dark;
        --bg: #0f172a;
        --text: #e2e8f0;
        --surface: #111827;
        --border: #374151;
        --action-border: #374151;
        --muted: #d1d5db;
        --footer: #d1d5db;
        --link: #93c5fd;
        --brand: #60a5fa;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          color-scheme: dark;
          --bg: #0f172a;
          --text: #e2e8f0;
          --surface: #111827;
          --border: #374151;
          --action-border: #374151;
          --muted: #d1d5db;
          --footer: #d1d5db;
          --link: #93c5fd;
          --brand: #60a5fa;
        }
      }
      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      header,
      footer {
        background: var(--surface);
        border-color: var(--border);
        border-style: solid;
        border-width: 0;
      }
      header {
        border-bottom-width: 1px;
      }
      footer {
        border-top-width: 1px;
      }
      .shell {
        width: min(100% - 2rem, 72rem);
        margin: 0 auto;
      }
      .site-header,
      .site-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 4.25rem;
        gap: 1rem;
      }
      .brand {
        color: var(--brand);
        font-size: 1.1rem;
        font-weight: 850;
        text-decoration: none;
      }
      main {
        display: grid;
        box-sizing: border-box;
        min-height: calc(100vh - 8.5rem);
        padding-block: 3rem;
        place-items: center;
      }
      .card {
        width: min(100% - 2rem, 34rem);
        box-sizing: border-box;
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        background: var(--surface);
        box-shadow: 0 12px 36px rgb(15 23 42 / 8%);
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--brand);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        letter-spacing: -0.04em;
      }
      .message {
        margin: 1rem auto 0;
        color: var(--muted);
        line-height: 1.65;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }
      a {
        color: var(--link);
        font-weight: 700;
      }
      a:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
      .action {
        display: inline-flex;
        min-height: 2.75rem;
        box-sizing: border-box;
        align-items: center;
        padding: 0.65rem 1rem;
        border: 1px solid var(--action-border);
        border-radius: 0.75rem;
        background: var(--surface);
        text-decoration: none;
      }
      .action-primary {
        border-color: #2563eb;
        background: #2563eb;
        color: #ffffff;
      }
      .site-footer {
        color: var(--footer);
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell site-header">
        <a class="brand" href="/">Smarter.Vote</a>
        <a href="/elections/">Browse elections</a>
      </div>
    </header>
    <main>
      <section class="card" aria-labelledby="not-found-heading">
        <p class="eyebrow">Error 404</p>
        <h1 id="not-found-heading">Page not found</h1>
        <p class="message">
          The page may have moved or the address may be incorrect. You can
          return home or continue to the election directory.
        </p>
        <div class="actions">
          <a class="action action-primary" href="/">Return home</a>
          <a class="action" href="/elections/">Browse elections</a>
        </div>
      </section>
    </main>
    <footer>
      <div class="shell site-footer">
        <span>Independent, sourced election research.</span>
        <a href="/about/">About Smarter.Vote</a>
      </div>
    </footer>
  </body>
</html>
