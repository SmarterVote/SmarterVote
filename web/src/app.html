<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Dark mode inline detection (fixes mobile blank screen / theme flash) -->
    <script>
      (function () {
        let enabled = false;
        try {
          const saved = localStorage.getItem("darkMode");
          if (saved !== null) {
            enabled = saved === "true";
          } else {
            enabled = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
        } catch (e) {
          try {
            enabled = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (err) {}
        }
        try {
          if (enabled) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
        // The forecast page is prerendered as the House tab; flag a first load
        // that asks for another tab so that page can hide the House content
        // until hydration instead of flashing it.
        try {
          var tab = new URLSearchParams(window.location.search).get("tab");
          if (
            window.location.pathname.indexOf("/forecast") === 0 &&
            tab &&
            tab !== "house"
          ) {
            document.documentElement.setAttribute(
              "data-forecast-pending-tab",
              tab,
            );
          }
        } catch (e) {}
      })();
    </script>

    <!-- Global SEO defaults (page-specific tags are set in each page's svelte:head) -->
    <meta name="author" content="Smarter.Vote" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-page text-content">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
